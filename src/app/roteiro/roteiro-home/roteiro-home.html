<div class="home-roteiro">
    <div>
    <h2>Roteiro de Entregas</h2>
    <div>
        <h2>Data do roteiro: {{ today | date: 'dd/MM/yyyy' }}</h2>
        
        <!-- Vincula ao FormGroup correto: 'data' -->
        <div [formGroup]="data"> 
            <label for="novaData">Escolha outra data de roteiro => </label>
            
            <!-- formControlName alterado para o nome correto declarado no TS: 'dataSelecionada' -->
            <input type="date" id="novaData" formControlName="dataSelecionada">
        </div>
        <br>
    </div>
</div>
    <div class="botoes">
        <div routerLink="/roteiro/adicionar"><app-button-component intext="Adicionar ao Roteiro"/></div>
        <div routerLink="/roteiro/fechar"><app-button-component intext="Fechar Roteiro"/></div>
    </div>
    <br>
    <div>
        <div>
            <app-tabela-component [roteiros]="listaDeRoteiros"/>
        </div>
    </div>
</div>
